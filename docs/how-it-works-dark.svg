<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 240" width="1110" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How CareWatch decides when to alert</title><desc id="d">Activity log, then a weighted deviation score that fixes the risk level, then specialist agents with retrieval and an LLM that only write the explanation, then alert suppression, then a Telegram alert with personal details removed. If the LLM fails, stock text is used and the level stays the same. GREEN sends nothing.</desc><path d="M30 80H1074" stroke="#8b949e" stroke-width="2" fill="none"/><path d="M1070 74L1082 80L1070 86Z" fill="#8b949e"/><path d="M190 80H212L222 52L236 108L248 40L260 96L270 80H370" stroke="#ff7b72" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="30" cy="80" r="5" fill="#8b949e"/><circle cx="470" cy="80" r="5" fill="#8b949e"/><circle cx="730" cy="80" r="5" fill="#8b949e"/><circle cx="970" cy="80" r="5" fill="#8b949e"/><path d="M470 80V196" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/><path d="M730 80V196" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/><text x="30" y="40" font-size="17" font-weight="600" fill="#e6edf3">Activity log</text><text x="30" y="112" font-size="14" fill="#9198a1">Per-resident</text><text x="30" y="132" font-size="14" fill="#9198a1">events in SQLite</text><text x="190" y="30" font-size="17" font-weight="600" fill="#ff7b72">Deviation score</text><text x="190" y="132" font-size="14" fill="#9198a1">Weighted sum against the resident's</text><text x="190" y="152" font-size="14" fill="#9198a1">own baseline, 0 to 100</text><text x="190" y="172" font-size="14" fill="#9198a1">0-30 GREEN, 31-60 YELLOW, 61+ RED</text><text x="470" y="40" font-size="17" font-weight="600" fill="#e6edf3">Specialists, RAG, LLM</text><text x="484" y="112" font-size="14" fill="#9198a1">Write the explanation;</text><text x="484" y="132" font-size="14" fill="#9198a1">the level is not theirs to change</text><text x="730" y="40" font-size="17" font-weight="600" fill="#e6edf3">Suppress</text><text x="744" y="112" font-size="14" fill="#9198a1">Same level repeated is muted:</text><text x="744" y="132" font-size="14" fill="#9198a1">5 min RED, 30 min YELLOW.</text><text x="744" y="152" font-size="14" fill="#9198a1">A rise in level always fires</text><text x="970" y="40" font-size="17" font-weight="600" fill="#e6edf3">Alert</text><text x="970" y="112" font-size="14" fill="#9198a1">Details stripped,</text><text x="970" y="132" font-size="14" fill="#9198a1">then Telegram</text><text x="484" y="208" font-size="14" fill="#9198a1">LLM fails: stock text, same level</text><text x="744" y="208" font-size="14" fill="#9198a1">GREEN: nothing is sent</text></svg>
